<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズバトル本編</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="screen-game-main" class="screen" style="display: block; max-width: 800px; margin: 20px auto; text-align: center;">
        <h1 id="game-title">⚔️ クイズバトル ⚔️</h1>
        
        <div class="card" style="padding: 40px 20px; background-color: #fff9c4;">
            <h2 style="border: none; margin-top: 0;">ゲーム画面（制作中）</h2>
            <p style="font-size: 18px; font-weight: bold;">ここにクイズの問題やバトル画面を作っていきます！</p>
            <p id="player-name-display" style="font-size: 16px; color: #333; margin-top: 20px;">ログインユーザー: 読み込み中...</p>
        </div>

        <!-- 💡 index.html（トップ画面）にいつでも戻れるボタン -->
        <button onclick="location.href='index.html'" style="background-color: #666; width: auto; padding: 10px 20px; margin-top: 20px;">トップ画面にもどる</button>
    </div>

    <!-- 将来的にゲーム専用のプログラムを作る場合は、ここにscriptタグを追加します -->

</html>
