<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アニマルクエスト ～動物村のクイズ大作戦～ | クエスト画面</title>
    <!-- クエスト画面専用のスタイルシート -->
    <link rel="stylesheet" href="css/style_game.css"> 
</head>
<body>

    <!-- クエスト画面全体を包むコンテナ -->
    <div id="game-container">
        <!-- ==========================================
             【New】AIクイズ自動生成中のローディング画面
             ========================================== -->
        <div id="ai-loading-screen" class="loading-overlay">
            <div class="loading-window">
                <div class="loading-spinner">🐾</div>
                <h2>AIが 10問のクイズを<br>がんばって 作っているよ…</h2>
                <p>少しまってね！</p>
            </div>
        </div>

        <!-- ==========================================
             1. 上部ヘッダーエリア（進行度ゲージ ＆ タイマーゲージ）
             ========================================== -->
        <header class="game-header">
            
            <!-- 上段：もんだい ＆ のこりじかん -->
            <div class="header-top-row">
                <!-- クイズの進行度表示 ＋ 進行ゲージ -->
                <div class="progress-container">
                    <div class="progress-box">
                        <span class="label">もんだい</span>
                        <span id="current-question-num" class="count">1</span> / 10
                    </div>
                    <div class="question-bar-bg">
                        <div id="question-bar-fill" class="question-bar-fill" style="width: 10%;"></div>
                    </div>
                </div>
                
                <!-- 残り時間 ＋ タイマーゲージ -->
                <div class="timer-container">
                    <div class="timer-box">
                        <span class="label">のこりじかん</span>
                    </div>
                    <div class="timer-bar-bg">
                        <div id="timer-bar-fill" class="timer-bar-fill" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <!-- 下段：みんなの合計スコアゲージ（同じ枠内に入りました） -->
            <div class="quota-container">
                <div class="quota-text-info">
                    <span>みんなの合計: <strong id="total-score">0</strong> ポイント</span>
                    <span>ノルマ: <strong id="clear-quota">300</strong> ポイント</span>
                </div>
                <div class="quota-bar-bg">
                    <div id="quota-bar-fill" class="quota-bar-fill" style="width: 0%;"></div>
                </div>
            </div>

        </header>

        <!-- ==========================================
             2. メインエリア（クイズ出題・回答・解説）
             ========================================== -->
        <main class="quiz-area">


            <!-- クイズの属性情報（ジャンル・学年バッジ） -->
            <div class="quiz-meta-info">
                <span id="quiz-genre" class="badge genre-badge">---</span>
                <span id="quiz-grade" class="badge grade-badge">---</span>
            </div>
            
            <!-- 問題文テキスト -->
            <div class="question-text-container">
                <h2 id="quiz-text">ここに問題文が読み込まれます。</h2>
            </div>

            <!-- 動的回答エリア（JSでクイズのtypeに合わせて中身を切り替え） -->
            <div id="quiz-inputs" class="inputs-container">
                <!-- JSでクイズのtype（四択 / 〇× / 直接入力）に応じたUIが自動挿入されます -->
            </div>

            <!-- 解説エリア（初期状態は「hidden」クラスで非表示、回答後に表示） -->
            <div id="explanation-area" class="explanation-box hidden">
                <div class="result-message-box">
                    <p id="result-message" class="result-text">---</p>
                </div>
                <div class="explanation-content">
                    <h3>【 かいせつ 】</h3>
                    <p id="explanation-text">ここにクイズの解説文が入ります。</p>
                </div>
                <!-- 次の問題へ進むボタン -->
                <div class="next-action-container">
                    <button id="next-question-btn" class="next-btn">つぎの問題へ ➔</button>
                </div>
            </div>

        </main>

        <!-- ==========================================
             3. 下部フッターエリア（ステータス・ノルマ）
             ========================================== -->
        <footer class="status-area">
            
            <!-- キャラクターたちの情報カード（3人分） -->
            <div class="party-status-container">
                <!-- プレイヤー自身 -->
                <div class="character-card player-card">
                    <div class="chara-img-wrapper">
                        <img id="player-img" src="" alt="じぶん">
                        <!-- ★ポイントポップアップ用の窓 -->
                        <div id="player-popup" class="point-popup hidden"></div>
                    </div>
                    <div class="chara-info">
                        <p class="chara-name">じぶん</p>
                    </div>
                </div>
            
                <!-- なかま1 -->
                <div class="character-card companion-card-1">
                    <div class="chara-img-wrapper">
                        <img id="npc1-img" src="" alt="なかま1">
                        <!-- ★ポイントポップアップ用の窓 -->
                        <div id="npc1-popup" class="point-popup hidden"></div>
                    </div>
                    <div class="chara-info">
                        <p id="npc1-name" class="chara-name">なかま1</p>
                    </div>
                </div>
            
                <!-- なかま2 -->
                <div class="character-card companion-card-2">
                    <div class="chara-img-wrapper">
                        <img id="npc2-img" src="" alt="なかま2">
                        <!-- ★ポイントポップアップ用の窓 -->
                        <div id="npc2-popup" class="point-popup hidden"></div>
                    </div>
                    <div class="chara-info">
                        <p id="npc2-name" class="chara-name">なかま2</p>
                    </div>
                </div>
            </div>

        </footer>

    </div>

    <!-- ==========================================
         4. 結果確認画面（リザルト画面）オーバーレイ
         ========================================== -->
    <div id="result-screen" class="result-overlay hidden">
        <div class="result-window">
            
            <!-- クリア / 失敗 の大見出し -->
            <h1 id="result-title" class="clear-title">STAGE CLEAR!! 🎉</h1>

            <!-- スコア結果発表詳細 -->
            <div class="result-scores-container">
                <div class="result-score-row">
                    <span>じぶんのスコア:</span>
                    <strong id="res-player-score">0</strong> Point
                </div>
                <div class="result-score-row">
                    <span>なかま1のスコア:</span>
                    <strong id="res-npc1-score">0</strong> Point
                </div>
                <div class="result-score-row">
                    <span>なかま2のスコア:</span>
                    <strong id="res-npc2-score">0</strong> Point
                </div>
                <div class="result-divider"></div>
                <div class="result-total-row">
                    <span>みんなの合計スコア:</span>
                    <h2><span id="res-total-score">0</span> / <span id="res-quota-score">300</span> Point</h2>
                </div>
            </div>

            <!-- 報酬（秘宝）＆新なかま獲得エリア -->
            <div id="reward-area" class="reward-box hidden">
                <h3 class="reward-header">🎁 ごほうびゲット！</h3>
                <div id="reward-content" class="reward-content">
                    <!-- JSで動的に挿入 -->
                </div>
            </div>

            <!-- 次へのアクション（地図画面へ戻る） -->
            <div class="result-actions">
                <button id="back-to-map-btn" class="map-return-btn">ちずに戻る ➔</button>
            </div>

        </div>
    </div>

    <!-- スクリプトの読み込み（モジュール対応） -->
    <script type="module" src="js/game-master.js"></script>
    <script type="module" src="js/script_game.js"></script>
</body>
</html>
