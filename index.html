<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理システム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==========================================
         【ログイン前】アカウント選択・登録画面
         ========================================== -->
    <div id="screen-login" class="screen active">
        <h1>アカウント選択</h1>
        
        <div class="card">
            <h2>この端末のアカウントをえらぶ</h2>
            <div id="login-user-list">
                <!-- 端末に紐づくアカウント一覧がここに表示されます -->
            </div>
        </div>

        <div class="card">
            <h2>あたらしく登録する</h2>
            <input type="text" id="username-input" placeholder="おなまえを入力してね">
            <select id="age-select">
                <option value="">-- 学年をえらんでね --</option>
                <option value="1">低学年・幼児</option>
                <option value="3">中学年</option>
                <option value="5">高学年</option>
            </select>
            <button onclick="handleRegister()">登録する</button>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn-minor" onclick="openAdminScreen()">管理者画面（かんりしゃ用）</button>
        </div>
    </div>

    <!-- ==========================================
         【ログイン後】メインメニュー＆ゲーム画面
         ========================================== -->
    <div id="screen-menu" class="screen">
        <h1 id="menu-welcome">ようこそ！</h1>
        <p id="user-stats"></p>
        
        <!-- 【重要】将来ゲーム画面（game.html）を表示するための<iframe>の窓 -->
        <div class="card" style="padding: 10px;">
            <iframe id="game-frame" src="game.html" style="width:100%; height:450px; border:none; border-radius: 6px; background-color: #fff;"></iframe>
        </div>
        
        <button class="btn-minor" onclick="logout()">アカウントをかえる（ログアウト）</button>
    </div>

    <!-- ==========================================
         【管理者】パスワード付きデータ編集画面
         ========================================== -->
    <div id="screen-admin" class="screen">
        <h1>管理者データ編集画面</h1>
        <div class="card">
            <button onclick="logout()" style="background-color: #666; margin-bottom: 15px;">トップ画面に戻る</button>
            <h2>全ユーザーデータ一覧</h2>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>おなまえ</th>
                            <th>学年クラス</th>
                            <th>勝ち数</th>
                            <th>レベル</th>
                            <th>端末ID</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-list">
                        <!-- 全ユーザーデータがここに一覧表示されます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- モジュールとしてJSを読み込み -->
    <script type="module" src="script.js"></script>
</body>
</html>
