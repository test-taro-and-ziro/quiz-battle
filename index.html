<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理システム</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. トップメニュー画面 -->
    <div id="screen-login" class="screen" style="position: relative;">
        <!-- 💡 管理者画面ボタンを一番上の右すみに小さく配置 -->
        <div style="position: absolute; top: 10px; right: 10px;">
            <button class="btn-minor" onclick="openAdminScreen()" style="font-size: 11px; padding: 4px 8px; background: #ccc; border: none; color: #666; border-radius: 4px; width: auto; margin: 0;">かんりしゃ用</button>
        </div>

        <h1 style="margin-top: 40px;">ゲームのトップ画面</h1>
        
        <!-- メインメニューボタン -->
        <div class="card" style="display: flex; flex-direction: column; gap: 20px; padding: 40px 20px;">
            <!-- 💡 あたらしくはじめる（新規作成画面へ切り替え） -->
            <button class="btn-start" onclick="changeScreen('screen-register')" style="background-color: #4CAF50; font-size: 22px; padding: 15px; margin: 0;">
                ✨ あたらしくはじめる
            </button>

            <!-- 💡 ログイン（クリックで入力欄が出現） -->
            <button class="btn-start" onclick="toggleLoginInput()" style="background-color: #2196F3; font-size: 22px; padding: 15px; margin: 0;">
                🔑 ログイン（つづきから）
            </button>
        </div>

        <!-- 【ログイン入力エリア】ログインボタンを押すと表示されます -->
        <div id="login-action-zone" class="card" style="display: none; background-color: #e3f2fd;">
            <h3 style="margin-top: 0;">おなまえを入力してね</h3>
            <input type="text" id="login-username-input" placeholder="登録したおなまえ">
            <button onclick="handleLogin()" style="background-color: #2196F3; margin-top: 10px;">決定</button>
        </div>

        <!-- 【キャラクター確認エリア】ログイン/新規登録に成功したら表示されます -->
        <div id="logged-in-char-zone" class="card" style="display: none; text-align: center; background-color: #fff9c4;">
            <h2 style="border: none; margin-top: 0;">きみのキャラクター</h2>
            <div class="char-profile">
                <!-- キャラクター絵の表示エリア -->
                <div id="char-image-container" style="margin: 15px auto; width: 120px; height: 120px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <img id="char-visual" src="placeholder.png" alt="キャラクターの絵" style="max-width: 100%; max-height: 100%;">
                </div>
                <!-- ステータス表示 -->
                <div style="font-size: 20px; font-weight: bold; margin-bottom: 5px;">
                    おなまえ：<span id="char-name">---</span>
                </div>
                <div style="font-size: 16px; color: #555; margin-bottom: 15px;">
                    ランク：<span id="char-rank">---</span>
                </div>
            </div>
            <!-- ゲーム本編へ進むボタン -->
            <button class="btn-start" onclick="startGame()" style="background-color: #ff9800; font-size: 20px; padding: 15px 30px; margin: 0;">ゲームをはじめる</button>
            <br>
            <button class="btn-minor" onclick="cancelLogin()" style="margin-top: 15px; background-color: #999;">やりなおす</button>
        </div>
    </div>

    <!-- 2. キャラクター新規作成画面（トップ画面から分離） -->
    <div id="screen-register" class="screen">
        <h1>あたらしく登録する</h1>
        <div class="card">
            <h2>キャラクターを作ろう！</h2>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">おなまえ：</label>
                <input type="text" id="username-input" placeholder="おなまえを入力してね">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">学年（ランク）：</label>
                <select id="age-select">
                    <option value="">-- 学年をえらんでね --</option>
                    <option value="1">低学年・幼児</option>
                    <option value="3">中学年</option>
                    <option value="5">高学年</option>
                </select>
            </div>
            <!-- 💡【追加】キャラクターの見た目をえらぶ項目 -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">キャラクターの見た目：</label>
                <select id="char-visual-select">
                    <option value="">-- キャラクターをえらんでね --</option>
                    <!-- 💡 今回追加してくれたウサギちゃんを指定できるようにします -->
                    <option value="usagi_1.jfif">うさぎ（男の子/女の子）</option>
                    <option value="placeholder.png">仮のキャラクター</option>
                </select>
            </div>
            <button onclick="handleRegister()" style="background-color: #4CAF50; width: 100%; font-size: 18px; padding: 12px; margin: 0;">このキャラクターで登録する</button>
            <button class="btn-minor" onclick="changeScreen('screen-login')" style="background-color: #999; width: 100%; margin-top: 10px;">もどる</button>
        </div>
    </div>

    <!-- 3. ログイン後のメインメニュー（ゲーム画面への入り口） -->
    <div id="screen-menu" class="screen">
        <h1 id="menu-welcome">ようこそ！</h1>
        <p id="user-stats" style="text-align: center; font-weight: bold; color: #4a5568;"></p>
        
        <div class="card" style="text-align: center; padding: 30px 15px;">
            <p>🎉 ログインに成功しました！</p>
            <p style="font-size: 14px; color: #666;">（ここに将来、別ファイルからゲーム画面を読み込みます）</p>
        </div>
        
        <button class="btn-minor" onclick="logout()">アカウントをかえる（ログアウト）</button>
    </div>

    <!-- 4. 管理者画面 -->
    <div id="screen-admin" class="screen">
        <h1>管理者データ編集画面</h1>
        <div class="card">
            <button onclick="logout()" style="background-color: #666; margin-bottom: 15px; width: auto;">トップ画面に戻る</button>
            <h2>全ユーザーデータ一覧</h2>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>おなまえ</th>
                            <th>学年クラス</th>
                            <th>勝ち数</th>
                            <th>レベル</th>
                            <th>端末ID</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-list">
                        <!-- 全ユーザーデータがここに一覧表示されます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebaseおよびメインスクリプトの読み込み -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://gstatic.com",
        "firebase/firestore": "https://gstatic.com"
      }
    }
    </script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
