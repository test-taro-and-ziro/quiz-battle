<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理システム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. ログイン / アカウント選択画面 -->
    <div id="screen-login" class="screen active">
        <h1>アカウント選択</h1>
        
        <div class="card">
            <h2>この端末のアカウントをえらぶ</h2>
            <div id="login-user-list">
                <!-- 読み込み中... の文字が入ります -->
            </div>
        </div>

        <div class="card">
            <h2>あたらしく登録する</h2>
            <input type="text" id="username-input" placeholder="おなまえを入力してね">
            <select id="age-select">
                <option value="">-- 学年をえらんでね --</option>
                <option value="1">低学年・幼児</option>
                <option value="3">中学年</option>
                <option value="5">高学年</option>
            </select>
            <button onclick="handleRegister()">登録する</button>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn-minor" onclick="openAdminScreen()">管理者画面（かんりしゃ用）</button>
        </div>
    </div>

    <!-- 2. ログイン後のメインメニュー（仮画面） -->
    <div id="screen-menu" class="screen">
        <h1 id="menu-welcome">ようこそ！</h1>
        <p id="user-stats"></p>
        
        <div class="card" style="text-align: center; padding: 30px 15px;">
            <p>🎉 ログインに成功しました！</p>
            <p style="font-size: 14px; color: #666;">（ここに将来、別ファイルからゲーム画面を読み込みます）</p>
        </div>
        
        <button class="btn-minor" onclick="logout()">アカウントをかえる（ログアウト）</button>
    </div>

    <!-- 3. 管理者画面 -->
    <div id="screen-admin" class="screen">
        <h1>管理者データ編集画面</h1>
        <div class="card">
            <button onclick="logout()" style="background-color: #666; margin-bottom: 15px;">トップ画面に戻る</button>
            <h2>全ユーザーデータ一覧</h2>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>おなまえ</th>
                            <th>学年クラス</th>
                            <th>勝ち数</th>
                            <th>レベル</th>
                            <th>端末ID</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-list">
                        <!-- 全ユーザーデータがここに一覧表示されます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- モジュールとして index.js を読み込み -->
    <script type="module" src="./index.js"></script>
</body>
</html>
