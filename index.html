<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズゲーム（仮）</title>
    <link rel="stylesheet" href="css/style_top.css">
</head>
<body>

    <!-- 1. トップメニュー画面 -->
    <div id="screen-login" class="screen" style="position: relative;">
        <!-- 💡 管理者画面ボタンを一番上の右すみに小さく配置 -->
        <div style="position: absolute; top: 10px; right: 10px;">
            <button class="btn-admin" onclick="openAdminScreen()" >admin</button>
        </div>

        <!-- 💡 文字の <h1>タイトル</h1> を削除し、ロゴが綺麗に見えるように上に少し広めの余白（透明のスペーサー）を空けました -->
        <div style="height: 400px;"></div>
        
        <!-- メインメニューボタン -->
        <div class="card" style="display: flex; flex-direction: column; gap: 20px; padding: 40px 20px;">
            <!-- 💡 あたらしくはじめる（新規作成画面へ切り替え） -->
            <button class="btn-start" onclick="changeScreen('screen-register')" style="background-color: #4CAF50; ">
                ✨ あたらしくはじめる
            </button>

            <!-- 💡 ログイン（クリックで入力欄が出現） -->
            <button class="btn-start" onclick="toggleLoginInput()" style="background-color: #2196F3; ">
                🔑 つづきからはじめる
            </button>
        </div>

        <!-- 【ログイン入力エリア】ログインボタンを押すと表示されます -->
        <div id="login-action-zone" class="card" style="display: none; background-color: #e3f2fd;">
            <h3 style="margin-top: 0;">おなまえを入力してね</h3>
            <input type="text" id="login-username-input" placeholder="登録したおなまえ">
            <button onclick="handleLogin()" style="background-color: #2196F3; margin-top: 10px;">決定</button>
        </div>

        <!-- 【キャラクター確認エリア】ログイン/新規登録に成功したら表示されます -->
        <div id="logged-in-char-zone" class="card" style="display: none; text-align: center; background-color: #fff9c4;">
            <h2 style="border: none; margin-top: 0;">きみのキャラクター</h2>
            <div class="char-profile">
                <!-- キャラクター絵の表示エリア -->
                <div id="char-image-container" style="margin: 15px auto; width: 120px; height: 120px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <img id="char-visual" src="images/placeholder.jpg" alt="キャラクターの絵" style="max-width: 100%; max-height: 100%;">
                </div>
                <!-- ステータス表示 -->
                <div style="font-size: 20px; font-weight: bold; margin-bottom: 5px;">
                    おなまえ：<span id="char-name">---</span>
                </div>
                <div style="font-size: 16px; color: #555; margin-bottom: 15px;">
                    ランク：<span id="char-rank">---</span>
                </div>
            </div>
            <!-- ゲーム本編へ進むボタン -->
            <button class="btn-start" onclick="startGame()" style="background-color: #ff9800; font-size: 20px; padding: 15px 30px; margin: 0;">ゲームをはじめる</button>
            <br>
            <button class="btn-minor" onclick="cancelLogin()" style="margin-top: 15px; background-color: #999;">ログアウト</button>
        </div>
    </div>

    <!-- 2. キャラクター新規作成画面（トップ画面から分離） -->
    <div id="screen-register" class="screen">
        <h1>あたらしく登録する</h1>
        <div class="card">
            <h2>キャラクターを作ろう！</h2>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">おなまえ：</label>
                <input type="text" id="username-input" placeholder="おなまえを入力してね">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">学年（ランク）：</label>
                <!-- 💡 データベースから自動でオプションを読み込むため、初期状態は空っぽです -->
                <select id="char-grade-select">
                    <option value="">-- よみこみ中... --</option>
                </select>
            </div>
            <!-- 💡 オス・メス（おとこのこ・おんなのこ）の選択肢を追加 -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">せいべつ：</label>
                <select id="gender-select" onchange="previewCharacter()">
                    <option value="">-- せいべつをえらんでね --</option>
                    <option value="male">おとこのこ (オス)</option>
                    <option value="female">おんなのこ (メス)</option>
                </select>
            </div>

            <!-- 💡 キャラクターの動物の選択肢（今回はうさぎ、そして今後増える想定で記載） -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">どうぶつ：</label>
                <!-- 💡 選んだらその場で画像が変わるように onchange="previewCharacter()" を追加 -->
                <select id="char-animal-select" onchange="previewCharacter()">
                    <option value="">-- どうぶつをえらんでね --</option>
                    <option value="usagi">うさぎ</option>
                </select>
            </div>

            <!-- 💡【新設】選んだキャラクターのイメージがその場で確認できるプレビューエリア -->
            <div class="preview-container">
                <div class="preview-title">キャラクターのイメージ</div>
                <div class="preview-circle">
                    <!-- 💡 最初は仮の画像、選ぶとJavaScriptで変わります -->
                    <img id="register-char-preview" src="images/placeholder.jpg" alt="プレビュー" class="preview-img">
                </div>
            </div>
            
            <button onclick="handleRegister()" style="background-color: #4CAF50; width: 100%; font-size: 18px; padding: 12px; margin: 0;">このキャラクターで登録する</button>
            <button class="btn-minor" onclick="changeScreen('screen-login')" style="background-color: #999; width: 100%; margin-top: 10px;">もどる</button>
        </div>
    </div>

    <!-- Firebaseおよびメインスクリプトの読み込み -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://gstatic.com",
        "firebase/firestore": "https://gstatic.com"
      }
    }
    </script>
    <script type="module" src="js/script_top.js"></script>
</body>
</html>
