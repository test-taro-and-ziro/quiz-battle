<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズバトル！ニンジャマスターズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-window">
    <div id="screen-login" class="screen active">
        <h1>クイズバトル！</h1>
        <h2>ニンジャマスターズ</h2>
        <p class="subtitle">おなまえを えらぶか、新しくつくってね！</p>
        
        <div class="user-list" id="login-user-list"></div>
        
        <input type="text" id="username-input" placeholder="あたらしい おなまえ" maxlength="10">
        <select id="age-select">
            <option value="">学年（ねんれい）をえらんでね</option>
            <option value="1">ようちえん・ほいくえん (5~6才)</option>
            <option value="1">小学校 1・2ねんせい</option>
            <option value="3">小学校 3・4ねんせい</option>
            <option value="5">小学校 5・6ねんせい</option>
        </select>
        
        <button class="btn btn-primary" onclick="handleRegister()">スタート！</button>
    </div>

    <div id="screen-menu" class="screen">
        <h1 id="menu-welcome">ようこそ！</h1>
        <p class="subtitle" id="user-stats">現在のランク: Lv.1</p>
        
        <h2 style="margin-bottom:10px;">どっちのクイズで しょうぶする？</h2>
        <button class="btn btn-primary" onclick="startBattle('こくご')">こくご</button>
        <button class="btn btn-secondary" onclick="startBattle('さんすう')">さんすう</button>
        <button class="btn btn-success" onclick="startBattle('どうとく')">どうとく</button>
        
        <button class="btn" style="background:#7f8c8d; font-size:14px; padding:8px;" onclick="logout()">別のユーザーにかえる</button>
    </div>

    <div id="screen-battle" class="screen">
        <div class="battle-header">
            <span id="battle-genre-label">ジャンル: こくご</span>
            <span id="battle-score-label">スコア: 0</span>
        </div>
        
        <div class="stage-area">
            <div class="fighter" id="player-fighter">
                <div class="avatar" id="player-avatar">プレイヤー</div>
                <div class="fighter-name" id="player-name-label">プレイヤー</div>
                <div class="hp-bar-bg"><div class="hp-bar" id="player-hp"></div></div>
                <div class="status-text" id="player-hp-text">HP: 100/100</div>
            </div>
            <div style="font-size: 24px; display: flex; align-items: center; font-weight: bold; color: #ff6b6b;">VS</div>
            <div class="fighter" id="npc-fighter">
                <div class="avatar" id="npc-avatar">アカニンジャ</div>
                <div class="fighter-name" id="npc-name-label">アカニンジャ</div>
                <div class="hp-bar-bg"><div class="hp-bar" id="npc-hp"></div></div>
                <div class="status-text" id="npc-hp-text">HP: 100/100</div>
            </div>
        </div>

        <div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
        <div class="quiz-box" id="quiz-text">もんだいがここにでるよ！</div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <div id="screen-result" class="screen">
        <h1 id="result-title">かち！</h1>
        <div id="result-avatar" style="font-size: 80px; margin: 20px 0;">🏆</div>
        <p id="result-text" style="font-size: 18px; font-weight: bold; text-align: center; padding: 0 20px;"></p>
        <button class="btn btn-primary" onclick="backToMenu()">メニューにもどる</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
