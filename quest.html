<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クエスト選択画面</title>
    <!-- 💡 新しく作った専用のスタイルシートを読み込みます -->
    <link rel="stylesheet" href="css/style_quest.css">
</head>
<body>

    <!-- 🗺️ 画面いっぱいの地図コンテナ -->
    <div class="map-container">
        
        <!-- 💡 変更点①：「トップへもどる」から「ゲームを終わる」ボタンに変更 -->
        <div class="exit-zone">
            <button class="btn-minor" onclick="location.href='index.html'">🛑 ゲームを終わる</button>
        </div>

        <!-- 💡 変更点③：地図上に浮かぶ半透明のプレイヤー情報箱 -->
        <div class="player-status-box">
            <div class="status-avatar">
                <img id="player-avatar" src="images/placeholder.png" alt="キャラ">
            </div>
            <div class="status-info">
                <div id="player-name" class="status-name">読み込み中...</div>
                <div id="player-grade" class="status-grade">---</div>
            </div>
        </div>

        <h1 class="map-title">ぼうけんのちず</h1>

        <!-- 💡 地図上に配置された冒険先のスタンプ（位置はCSSで調整） -->
        <!-- 💡 地図の中心に表示されるプレイヤーの村（スタート地点） -->
        <div class="map-village">
            <div class="village-icon-wrap">
                <!-- 💡 お手元の村の画像を「village.jpg」などの名前でimagesフォルダに入れて指定してください -->
                <img src="images/village.jpg" alt="プレイヤーの村" class="village-img">
            </div>
            <div class="village-label">プレイヤーの村</div>
        </div>
        
        <!-- 🌳 近くの森 -->
        <button class="stamp-btn stamp-forest" onclick="selectQuest('近くの森')">
            <div class="stamp-icon">🌳</div>
            <div class="stamp-label">近くの森</div>
        </button>

        <!-- 💧 きれいな泉 -->
        <button class="stamp-btn stamp-spring" onclick="selectQuest('きれいな泉')">
            <div class="stamp-icon">💧</div>
            <div class="stamp-label">きれいな泉</div>
        </button>

        <!-- 🪨 くらい洞窟 -->
        <button class="stamp-btn stamp-cave" onclick="selectQuest('くらい洞窟')">
            <div class="stamp-icon">🪨</div>
            <div class="stamp-label">くらい洞窟</div>
        </button>

        <!-- 💡 変更点②：ジャンルを選択する小さな小窓（最初は非表示、スタンプを押すと浮かび上がります） -->
        <div id="genre-modal-overlay" class="modal-overlay" style="display: none;">
            <div class="genre-window">
                <h3>⚔️ クエストしゅっぱつ ⚔️</h3>
                <p class="window-target-text"><span id="selected-quest-name">---</span> にいくよ！</p>
                <p class="window-sub-text">挑戦するクイズのジャンルをえらんでね</p>
                
                <div class="window-btn-group">
                    <button class="btn-genre btn-math" onclick="goToGame('math')">➕ さんすう（算数）</button>
                    <button class="btn-genre btn-japanese" onclick="goToGame('japanese')">📖 こくご（国語）</button>
                </div>
                
                <button class="btn-cancel" onclick="cancelQuestSelect()">えらびなおす</button>
            </div>
        </div>

    </div>


    <!-- 地図画面用の専用スクリプト -->
    <script type="module" src="js/script_quest.js"></script>
</body>
</html>
