<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クエスト選択画面</title>
    <!-- 💡 新しく作った専用のスタイルシートを読み込みます -->
    <link rel="stylesheet" href="css/style_quest.css">
</head>
<body>

    <!-- 🗺️ 画面いっぱいの地図コンテナ -->
    <div class="map-container">

        <!-- 🛑 ログアウトボタン -->
        <div class="exit-zone">
            <button class="btn-minor" onclick="logout()">🛑 ログアウト</button>
        </div>

        <!-- 👤 地図上に浮かぶ半透明のプレイヤー情報箱（クリックで詳細画面へ） -->
        <div class="player-status-box" id="player-status-trigger">
            <div class="status-avatar">
                <img id="player-avatar" src="images/placeholder.jpg" alt="キャラ">
            </div>
            <div class="status-info">
                <div id="player-name" class="status-name">読み込み中...</div>
                <div id="player-grade" class="status-grade">学年: ---</div>
                <div id="player-rank" class="status-rank">ランク: --</div>
            </div>
        </div>

        <!-- 💡 地図の中心に表示されるプレイヤーの村（スタート地点） -->
        <div class="map-village">
            <div class="village-icon-wrap">
                <!-- 💡 お手元の村の画像を「village.jpg」などの名前でimagesフォルダに入れて指定してください -->
                <img src="images/village.jpg" alt="こもれびのむら" class="village-img">
            </div>
            <div class="village-label">こもれびのむら</div>
        </div>
        
        <!-- 💡 画面左上に固定表示される「ぼうけん先えらび」の箇条書きメニュー箱 -->
        <div class="quest-menu-box">
            <div class="menu-title">🚩 どこに ぼうけんにいく？</div>
            <!-- 💡 中身を空っぽにして、id="dungeon-list-container" を追加します -->
            <div class="menu-list" id="dungeon-list-container"></div>
        </div>

        <!-- 💬 ジャンルを選択する小さな小窓（モーダル） -->
        <div id="genre-modal-overlay" class="modal-overlay" style="display: none;">
            <div class="genre-window">
                <h3>⚔️ クエストしゅっぱつ ⚔️</h3>
                <p class="window-target-text"><span id="selected-quest-name">---</span> にいくよ！</p>
                <p class="window-norma-text">クリアノルマ: <span id="selected-quest-norma">---</span> Point</p>
                <p class="window-sub-text">挑戦するクイズのジャンルをえらんでね</p>
                
                <!-- 💡 中身を空っぽにして、id="genre-list-container" を追加します -->
                <div class="window-btn-group" id="genre-list-container"></div>
                
                <button class="btn-cancel" onclick="cancelQuestSelect()">えらびなおす</button>
            </div>
        </div>

        <!-- 🏆 ユーザー詳細＆ひほう（秘宝）確認モーダル -->
        <div id="profile-modal-overlay" class="profile-modal-overlay">
            <div class="profile-window">
                <h3 class="profile-title">📜 ぼうけんの記録（きろく） 📜</h3>
                
                <!-- ユーザー基本情報エリア -->
                <div class="profile-user-zone">
                    <div class="profile-avatar-wrap">
                        <img id="profile-modal-avatar" src="images/placeholder.jpg" alt="キャラ">
                    </div>
                    <div class="profile-text-wrap">
                        <div id="profile-modal-name" class="profile-name">---</div>
                        <div id="profile-modal-grade" class="profile-grade">---</div>
                        <div id="profile-modal-rank" class="profile-grade">---</div>
                    </div>
                </div>
                
                <!-- タブ切り替え -->
                <div class="profile-tab-buttons">
                    <button class="profile-tab-btn active" data-tab="treasure">あつめたひほう</button>
                    <button class="profile-tab-btn" data-tab="companions">つれている仲間</button>
                </div>

                <!-- 🏅 ひほう（秘宝）コレクションエリア -->
                <div id="tab-treasure" class="profile-tab-content treasure-section active">
                    <h4 class="treasure-title">✨ あつめた秘宝（ひほう） ✨</h4>
                    <div class="treasure-list" id="treasure-list-container">
                        <!-- JSで丸い枠の秘宝アイコンがここに自動生成されます -->
                    </div>
                </div>
                <!-- つれている仲間 エリア -->
                <div id="tab-companions" class="profile-tab-content">
                    <h4 class="companion-title">🐾 つれている仲間（なかま） 🐾</h4>
                    <div id="profile-companion-list"></div>
                </div>
                
                <button id="btn-close-profile" class="btn-profile-close">とじる</button>
            </div>
        </div>
        
    </div>

    <!-- 地図画面用の専用スクリプト -->
    <script type="module" src="js/script_quest.js"></script>
</body>
</html>
