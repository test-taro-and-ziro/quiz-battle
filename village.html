<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こもれびの村</title>
    <link rel="stylesheet" href="css/style_village.css">
</head>
<body>

    <div class="village-container">

        <!-- 左上メニュー（クエスト選択画面と同じ） -->
        <div class="village-menu-box">
            <button class="menu-item-btn" onclick="goQuest()">🏰 クエストへもどる</button>
            <button class="menu-item-btn" id="open-companion-setting">👥 仲間（なかま）</button>
        </div>

        <!-- 背景画像 -->
        <div class="village-background"></div>

    </div>

    <!-- 仲間設定ポップアップ -->
    <div id="companion-modal" class="modal-overlay hidden">
        <div class="modal-window">
    
            <h2 class="companion-title">つれていく仲間（なかま）をえらぶ</h2>
    
            <div class="companion-setting-vertical">
    
                <!-- ★ 上：連れていく仲間（横並び） -->
                <div class="companion-block">
                    <h3 class="title-equipment">つれていく仲間（なかま）　<b>2人まで</b></h3>
                    <div id="equipment-list" class="equipment-row"></div>
                </div>
    
                <!-- 下：友達になった仲間（縦並び） -->
                <div class="companion-block">
                    <h3 class="title-companions">ともだちになった仲間（なかま）</h3>
                    <div id="companions-list"></div>
                </div>
    
            </div>

            <button class="save-btn" onclick="saveCompanionSetting()">保存（ほぞん）</button>
            <button class="close-btn" onclick="closeCompanionModal()">とじる</button>
        </div>
    </div>
    
    <script type="module" src="js/script_village.js"></script>
</body>
</html>
