<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者コントロールパネル</title>
    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="css/style_admin.css">
</head>
<body>

    <div id="screen-admin" class="screen" style="display: block; max-width: 900px; margin: 20px auto;">
        <h1>管理者コントロールパネル</h1>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <!-- 💡 タブメニューを「ユーザー」と「学年」の2つに整理 -->
                <div class="admin-tabs" style="display: flex; gap: 10px;">
                    <button class="tab-btn active" onclick="switchAdminTab('tab-users')">ユーザー管理</button>
                    <button class="tab-btn" onclick="switchAdminTab('tab-grades')">学年管理</button>
                    <button class="tab-btn" onclick="switchAdminTab('tab-questions')">クイズ管理</button>
                </div>
                <button onclick="location.href='index.html'" style="background-color: #666; width: auto; margin: 0; padding: 8px 16px;">トップ画面に戻る</button>
            </div>

            <!-- タブ1: ユーザー管理 -->
            <div id="tab-users" class="admin-tab-content active">
                <h2>全ユーザーデータ一覧</h2>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>おなまえ</th>
                                <th>学年クラス</th>
                                <th>せいべつ</th>
                                <th>どうぶつ</th>
                                <th>勝ち数</th>
                                <th>レベル</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-user-list">
                            <!-- JSで挿入 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- タブ2: 学年管理 -->
            <div id="tab-grades" class="admin-tab-content">
                <h2>学年選択肢の管理</h2>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>送信値 (value)</th>
                                <th>表示名 (label)</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-grade-list">
                            <!-- JSで挿入 -->
                        </tbody>
                    </table>
                </div>
                <div class="card" style="margin-top: 15px; background: #fff;">
                    <h3>➕ 新しい学年を追加</h3>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="new-grade-value" placeholder="数値 (例: 6)">
                        <input type="text" id="new-grade-label" placeholder="表示名 (例: 6年生)">
                        <button onclick="addGradeFromAdmin()" style="background-color: #4CAF50; width: auto; white-space: nowrap;">追加</button>
                    </div>
                </div>
            </div>

            <!-- 💡【新設】タブ3: クイズ管理 -->
            <div id="tab-questions" class="admin-tab-content">
                <h2>クイズ問題の管理（1問1レコード）</h2>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>学年</th>
                                <th>ジャンル</th>
                                <th>タイプ</th>
                                <th>問題文</th>
                                <th>選択肢（カンマ区切り）</th>
                                <th>正解</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-question-list">
                            <!-- JSで挿入 -->
                        </tbody>
                    </table>
                </div>

                <!-- 💡 クイズ問題の追加フォーム -->
                <div class="card" style="margin-top: 15px; background: #fff;">
                    <h3>➕ 新しいクイズ問題を追加（ドキュメントID自動生成）</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; gap: 10px;">
                            <select id="new-q-grade" style="flex: 1;">
                                <option value="">-- 対象の学年を選んでね --</option>
                                <!-- JSで学年マスターから自動挿入されます -->
                            </select>
                            <input type="text" id="new-q-genre" placeholder="ジャンル (例: math, japanese)" style="flex: 1;">
                            <select id="new-q-type" style="flex: 1;">
                                <option value="四択">四択</option>
                                <option value="○×">○×</option>
                                <option value="直接入力">直接入力</option>
                            </select>
                        </div>
                        <input type="text" id="new-q-text" placeholder="問題文 (例: 1たす2は なにかな？)">
                        <input type="text" id="new-q-choices" placeholder="選択肢をカンマ「,」で区切って入力 (例: 1,2,3,4 ) ※○×なら「○,×」 ※直接入力なら空欄でOK">
                        <input type="text" id="new-q-answer" placeholder="正解の文字 (例: 3 ) ※選択肢の中のどれかと完全に一致させてね">
                        <button onclick="addQuestionFromAdmin()" style="background-color: #4CAF50; width: 100%; margin-top: 5px;">このクイズを追加する</button>
                    </div>
                </div>
            </div>

            
        </div>
    </div>

    <!-- Firebaseおよび管理専用スクリプトの読み込み -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://gstatic.com",
        "firebase/firestore": "https://gstatic.com"
      }
    }
    </script>
    <!-- JSの読み込み -->
    <script type="module" src="js/script_admin.js"></script>
</body>
</html>
